<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resort Digital Signage - Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            margin: 0;
            overflow: hidden; /* Strictly no scrolling for signage */
            user-select: none;
        }

        #signage-container {
            width: 100vw;
            height: 100vh;
            max-width: 1080px;
            max-height: 1920px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            background-image: url('https://raw.githubusercontent.com/evildee09-glitch/HprimeWeather/main/East%20Wing.jpg');
            background-size: cover;
            background-position: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.75) 100%);
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 3.5rem;
            color: white;
            box-sizing: border-box;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 2.2rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div id="signage-container">
        <div class="overlay"></div>
        
        <div class="content-layer">
            <!-- Header: Logo & Clock -->
            <div class="flex justify-between items-center">
                <!-- Much larger resort logo -->
                <img src="https://raw.githubusercontent.com/evildee09-glitch/HprimeWeather/main/HENANN%20PRIME%20Beach%20Resort%20Logo_white.png" alt="Henann Prime Logo" class="h-44 w-auto object-contain drop-shadow-lg">
                <div class="text-right">
                    <h1 id="time" class="text-6xl font-bold tracking-tight mb-1">--:--</h1>
                    <p id="date" class="text-2xl font-light text-gray-200">Loading date...</p>
                </div>
            </div>

            <!-- Main Current Weather -->
            <div class="glass-panel text-center flex flex-col justify-center my-2">
                <h2 class="text-3xl font-medium tracking-widest uppercase mb-2 text-gray-300">Boracay, Philippines</h2>
                <div class="flex items-center justify-center gap-6 mb-2">
                    <i id="current-icon" data-lucide="sun" class="w-32 h-32"></i>
                    <span id="current-temp" class="text-[10rem] font-bold leading-none tracking-tighter">--°</span>
                </div>
                <p id="current-desc" class="text-4xl font-light mb-4 capitalize">Loading...</p>
                
                <div class="flex justify-center gap-12 text-2xl font-light border-t border-white/20 pt-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="thermometer" class="w-7 h-7"></i>
                        <span>High: <span id="temp-high" class="font-medium">--°</span></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <i data-lucide="thermometer-snowflake" class="w-7 h-7"></i>
                        <span>Low: <span id="temp-low" class="font-medium">--°</span></span>
                    </div>
                </div>
            </div>

            <!-- Details -->
            <div class="grid grid-cols-2 gap-6 my-2">
                <div class="glass-panel flex flex-col items-center justify-center py-6">
                    <i data-lucide="wind" class="w-12 h-12 mb-2 text-blue-300"></i>
                    <span class="text-xl text-gray-300 uppercase tracking-widest mb-1">Wind</span>
                    <span id="wind-speed" class="text-4xl font-semibold">-- km/h</span>
                </div>
                <div class="glass-panel flex flex-col items-center justify-center py-6">
                    <i data-lucide="droplets" class="w-12 h-12 mb-2 text-blue-300"></i>
                    <span class="text-xl text-gray-300 uppercase tracking-widest mb-1">Humidity</span>
                    <span id="humidity" class="text-4xl font-semibold">--%</span>
                </div>
            </div>

            <!-- 5 Day Forecast -->
            <div class="glass-panel my-2">
                <h3 class="text-2xl font-medium tracking-widest text-center mb-4 uppercase text-gray-300">5-Day Forecast</h3>
                <div id="forecast-container" class="flex justify-between items-center px-2">
                    <!-- Forecast items injected via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Hardcoded Coordinates for Henann Prime Beach Resort, Boracay
        const LATITUDE = 11.97;
        const LONGITUDE = 121.92;

        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        const weatherCodes = {
            0: { icon: 'sun', desc: 'Clear sky' },
            1: { icon: 'sun', desc: 'Mainly clear' },
            2: { icon: 'cloud-sun', desc: 'Partly cloudy' },
            3: { icon: 'cloud', desc: 'Overcast' },
            45: { icon: 'cloud-fog', desc: 'Fog' },
            48: { icon: 'cloud-fog', desc: 'Depositing rime fog' },
            51: { icon: 'cloud-drizzle', desc: 'Light drizzle' },
            53: { icon: 'cloud-drizzle', desc: 'Moderate drizzle' },
            55: { icon: 'cloud-drizzle', desc: 'Dense drizzle' },
            61: { icon: 'cloud-rain', desc: 'Slight rain' },
            63: { icon: 'cloud-rain', desc: 'Moderate rain' },
            65: { icon: 'cloud-rain', desc: 'Heavy rain' },
            71: { icon: 'cloud-snow', desc: 'Slight snow' },
            73: { icon: 'cloud-snow', desc: 'Moderate snow' },
            75: { icon: 'cloud-snow', desc: 'Heavy snow' },
            77: { icon: 'snowflake', desc: 'Snow grains' },
            80: { icon: 'cloud-rain', desc: 'Slight rain showers' },
            81: { icon: 'cloud-rain', desc: 'Moderate rain showers' },
            82: { icon: 'cloud-lightning', desc: 'Violent rain showers' },
            95: { icon: 'cloud-lightning', desc: 'Thunderstorm' },
            96: { icon: 'cloud-lightning', desc: 'Thunderstorm with hail' },
            99: { icon: 'cloud-lightning', desc: 'Heavy thunderstorm' }
        };

        async function fetchWeather() {
            try {
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FManila`);
                const weatherData = await weatherRes.json();

                const current = weatherData.current;
                const today = weatherData.daily;
                const condition = weatherCodes[current.weather_code] || weatherCodes[0];

                document.getElementById('current-temp').innerText = Math.round(current.temperature_2m) + '°';
                document.getElementById('current-desc').innerText = condition.desc;
                document.getElementById('temp-high').innerText = Math.round(today.temperature_2m_max[0]) + '°';
                document.getElementById('temp-low').innerText = Math.round(today.temperature_2m_min[0]) + '°';
                document.getElementById('wind-speed').innerText = Math.round(current.wind_speed_10m) + ' km/h';
                document.getElementById('humidity').innerText = current.relative_humidity_2m + '%';

                const iconContainer = document.getElementById('current-icon');
                iconContainer.setAttribute('data-lucide', condition.icon);

                const forecastContainer = document.getElementById('forecast-container');
                forecastContainer.innerHTML = '';
                
                for (let i = 1; i <= 5; i++) {
                    const date = new Date(today.time[i]);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
                    const dayCode = today.weather_code[i];
                    const dayIcon = weatherCodes[dayCode] ? weatherCodes[dayCode].icon : 'sun';
                    const tempMax = Math.round(today.temperature_2m_max[i]);
                    const tempMin = Math.round(today.temperature_2m_min[i]);

                    const dayHTML = `
                        <div class="flex flex-col items-center">
                            <span class="text-xl font-medium mb-2">${dayName}</span>
                            <i data-lucide="${dayIcon}" class="w-10 h-10 mb-2"></i>
                            <span class="text-xl font-semibold">${tempMax}°</span>
                            <span class="text-lg text-gray-300">${tempMin}°</span>
                        </div>
                    `;
                    forecastContainer.innerHTML += dayHTML;
                }

                lucide.createIcons();

            } catch (error) {
                console.error("Error fetching weather:", error);
                document.getElementById('current-desc').innerText = "Weather unavailable";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 30 * 60 * 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resort Digital Signage - Weather</title>

<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>

<style>
  /* Hand-written CSS replaces the Tailwind CDN (which compiles styles in the browser on every load) */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#000;color:#fff;overflow:hidden;user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  #signage{
    width:100vw;height:100vh;max-width:1080px;max-height:1920px;margin:0 auto;
    position:relative;overflow:hidden;
    background:linear-gradient(#0b2a3a,#04121b); /* shows instantly while the photo downloads */
  }
  .bg{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
    opacity:0;transition:opacity .8s ease;
  }
  .bg.on{opacity:1}
  .overlay{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(to bottom,rgba(0,0,0,.5) 0%,rgba(0,0,0,.75) 100%);
  }
  .content{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:3rem 3.5rem;
  }
  .glass{
    background:rgba(255,255,255,.1);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:28px;padding:2.2rem 2.5rem;
    box-shadow:0 25px 50px -12px rgba(0,0,0,.6);
    margin:.5rem 0;
  }
  .ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  header{display:flex;justify-content:space-between;align-items:center}
  .logo{height:11rem;width:auto;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(0,0,0,.3))}
  .clock{text-align:right}
  #time{margin:0 0 .25rem;font-size:3.75rem;line-height:1;font-weight:700;letter-spacing:-.025em}
  #date{margin:0;font-size:1.5rem;font-weight:300;color:#e5e7eb}

  .now{text-align:center;display:flex;flex-direction:column;justify-content:center}
  .place{margin:0 0 .5rem;font-size:1.875rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#d1d5db}
  .temp-row{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-bottom:.5rem}
  #current-icon{width:8rem;height:8rem}
  #current-temp{font-size:10rem;font-weight:700;line-height:1;letter-spacing:-.05em}
  #current-desc{margin:0 0 1rem;font-size:2.25rem;font-weight:300}
  .hilo{display:flex;justify-content:center;gap:3rem;font-size:1.5rem;font-weight:300;border-top:1px solid rgba(255,255,255,.2);padding-top:1rem}
  .hilo div{display:flex;align-items:center;gap:.5rem}
  .hilo .ic{width:1.75rem;height:1.75rem}
  .hilo b{font-weight:500}

  .details{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem;margin:.5rem 0}
  .details .glass{margin:0;padding:1.5rem .75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .details .ic{width:3rem;height:3rem;margin-bottom:.5rem;color:#93c5fd}
  .label{font-size:1.1rem;color:#d1d5db;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.25rem;white-space:nowrap}
  .value{font-size:2rem;font-weight:600;white-space:nowrap}

  .fc-title{margin:0 0 1rem;font-size:1.5rem;font-weight:500;letter-spacing:.1em;text-align:center;text-transform:uppercase;color:#d1d5db}
  #forecast{display:flex;justify-content:space-between;align-items:center;padding:0 .5rem}
  .day{display:flex;flex-direction:column;align-items:center}
  .day .dn{font-size:1.25rem;font-weight:500;margin-bottom:.5rem}
  .day .ic{width:2.5rem;height:2.5rem;margin-bottom:.5rem}
  .day .hi{font-size:1.25rem;font-weight:600}
  .day .lo{font-size:1.125rem;color:#d1d5db}
  .day .rain{margin-top:.35rem;font-size:1rem;color:#93c5fd}
  #updated{margin:1.1rem 0 0;text-align:center;font-size:1rem;font-weight:300;color:#9ca3af}
</style>
</head>
<body>

<!-- Inline icon sprite (replaces the Lucide script from unpkg: no extra download, works offline) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-cloud-sun" viewBox="0 0 24 24"><path d="M12 2v2m-7.07.93 1.41 1.41M20 12h2m-2.93-7.07-1.41 1.41M15.947 12.65a4 4 0 0 0-5.925-4.128M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></symbol>
    <symbol id="i-cloud-moon" viewBox="0 0 24 24"><path d="M10.188 8.5A6 6 0 0 1 16 4a1 1 0 0 0 6 6 6 6 0 0 1-3 5.197M13 16a3 3 0 1 1 0 6H7a5 5 0 1 1 4.9-6Z"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="i-cloud-fog" viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M16 17H7m10 4H9"/></symbol>
    <symbol id="i-cloud-drizzle" viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M8 19v1m0-6v1m8 4v1m0-6v1m-4 6v1m0-6v1"/></symbol>
    <symbol id="i-cloud-rain" viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M16 14v6M8 14v6m4-4v6"/></symbol>
    <symbol id="i-cloud-lightning" viewBox="0 0 24 24"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973M13 12l-3 5h4l-3 5"/></symbol>
    <symbol id="i-cloud-snow" viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M8 15h.01M8 19h.01M12 17h.01M12 21h.01M16 15h.01M16 19h.01"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2m10.6 11.4A2 2 0 1 0 14 16H2"/></symbol>
    <symbol id="i-droplets" viewBox="0 0 24 24"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05zM12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></symbol>
    <symbol id="i-thermometer" viewBox="0 0 24 24"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 19V5"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14m7-7-7 7-7-7"/></symbol>
    <symbol id="i-umbrella" viewBox="0 0 24 24"><path d="M22 12a10.06 10.06 1 0 0-20 0Zm-10 0v8a2 2 0 0 0 4 0M12 2v1"/></symbol>
  </defs>
</svg>

<div id="signage">
  <!-- Local file first (bg.jpg next to this page); falls back to GitHub if it is missing -->
  <img class="bg" id="bg" alt="" fetchpriority="high" decoding="async"
       src="bg.jpg"
       onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/evildee09-glitch/HprimeWeather/main/East%20Wing.jpg'">
  <div class="overlay"></div>

  <div class="content">
    <header>
      <img class="logo" alt="Henann Prime Beach Resort" fetchpriority="high" decoding="async"
           src="logo.png"
           onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/evildee09-glitch/HprimeWeather/main/HENANN%20PRIME%20Beach%20Resort%20Logo_white.png'">
      <div class="clock">
        <h1 id="time">--:--</h1>
        <p id="date">&nbsp;</p>
      </div>
    </header>

    <section class="glass now">
      <h2 class="place">Boracay, Philippines</h2>
      <div class="temp-row">
        <svg class="ic" id="current-icon" viewBox="0 0 24 24"><use href="#i-sun"/></svg>
        <span id="current-temp">--°</span>
      </div>
      <p id="current-desc">Loading...</p>
      <div class="hilo">
        <div><svg class="ic" viewBox="0 0 24 24"><use href="#i-arrow-up"/></svg><span>High: <b id="temp-high">--°</b></span></div>
        <div><svg class="ic" viewBox="0 0 24 24"><use href="#i-arrow-down"/></svg><span>Low: <b id="temp-low">--°</b></span></div>
      </div>
    </section>

    <section class="details">
      <div class="glass">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-wind"/></svg>
        <span class="label">Wind</span><span class="value" id="wind-speed">--</span>
      </div>
      <div class="glass">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-droplets"/></svg>
        <span class="label">Humidity</span><span class="value" id="humidity">--%</span>
      </div>
      <div class="glass">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-thermometer"/></svg>
        <span class="label">Feels like</span><span class="value" id="feels">--°</span>
      </div>
      <div class="glass">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-umbrella"/></svg>
        <span class="label">Rain today</span><span class="value" id="rain-today">--%</span>
      </div>
    </section>

    <section class="glass">
      <h3 class="fc-title">5-Day Forecast</h3>
      <div id="forecast"></div>
      <p id="updated"></p>
    </section>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---- Config -------------------------------------------------------------
  const LAT = 11.97, LON = 121.92;          // Boracay
  const TZ = 'Asia/Manila';                 // Clock + forecast days always follow resort time
  const REFRESH_MS = 15 * 60 * 1000;        // Open-Meteo "current" data updates every 15 min
  const RETRY_MS = 60 * 1000;               // First retry after 1 min, doubling up to 5 min
  const FETCH_TIMEOUT_MS = 20 * 1000;      // generous for slow wifi
  const MAX_CACHE_AGE_MS = 6 * 60 * 60 * 1000; // Keep showing last known weather for up to 6 h offline
  const STALE_AFTER_MS = 45 * 60 * 1000;       // Label data "last known" after this
  const CACHE_KEY = 'hprime-weather-v2';

  const API_URL = 'https://api.open-meteo.com/v1/forecast?' + new URLSearchParams({
    latitude: LAT,
    longitude: LON,
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
    timezone: TZ,
    forecast_days: 6,
    wind_speed_unit: 'kmh'
  });

  // ---- Helpers ------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const el = {
    bg: $('bg'), time: $('time'), date: $('date'),
    icon: $('current-icon'), temp: $('current-temp'), desc: $('current-desc'),
    hi: $('temp-high'), lo: $('temp-low'), wind: $('wind-speed'), hum: $('humidity'),
    feels: $('feels'), rain: $('rain-today'), fc: $('forecast'), updated: $('updated')
  };

  // Background fades in once loaded (handles already-cached images too)
  const showBg = () => el.bg.classList.add('on');
  el.bg.addEventListener('load', showBg);
  if (el.bg.complete && el.bg.naturalWidth) showBg();

  const num = v => (typeof v === 'number' && isFinite(v)) ? Math.round(v) : null;
  const deg = v => (num(v) === null ? '--°' : num(v) + '°');
  const pct = v => (num(v) === null ? '--%' : num(v) + '%');
  const setIcon = (svg, name) => svg.firstElementChild.setAttribute('href', '#i-' + name);

  // ---- Clock (fixed to resort time, redraws only when the minute changes) -
  const timeFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true });
  const dateFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'long', month: 'long', day: 'numeric' });
  const dayFmt  = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short' });

  function tickClock() {
    const now = new Date();
    el.time.textContent = timeFmt.format(now);
    el.date.textContent = dateFmt.format(now);
    setTimeout(tickClock, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 50);
  }
  tickClock();

  // ---- WMO weather codes (complete table, incl. freezing drizzle/rain) ----
  // [description, day icon, night icon]
  const WMO = {
    0: ['Clear sky', 'sun', 'moon'],
    1: ['Mainly clear', 'sun', 'moon'],
    2: ['Partly cloudy', 'cloud-sun', 'cloud-moon'],
    3: ['Overcast', 'cloud', 'cloud'],
    45: ['Fog', 'cloud-fog', 'cloud-fog'],
    48: ['Rime fog', 'cloud-fog', 'cloud-fog'],
    51: ['Light drizzle', 'cloud-drizzle', 'cloud-drizzle'],
    53: ['Moderate drizzle', 'cloud-drizzle', 'cloud-drizzle'],
    55: ['Dense drizzle', 'cloud-drizzle', 'cloud-drizzle'],
    56: ['Freezing drizzle', 'cloud-drizzle', 'cloud-drizzle'],
    57: ['Freezing drizzle', 'cloud-drizzle', 'cloud-drizzle'],
    61: ['Slight rain', 'cloud-rain', 'cloud-rain'],
    63: ['Moderate rain', 'cloud-rain', 'cloud-rain'],
    65: ['Heavy rain', 'cloud-rain', 'cloud-rain'],
    66: ['Freezing rain', 'cloud-rain', 'cloud-rain'],
    67: ['Freezing rain', 'cloud-rain', 'cloud-rain'],
    71: ['Slight snow', 'cloud-snow', 'cloud-snow'],
    73: ['Moderate snow', 'cloud-snow', 'cloud-snow'],
    75: ['Heavy snow', 'cloud-snow', 'cloud-snow'],
    77: ['Snow grains', 'cloud-snow', 'cloud-snow'],
    80: ['Light rain showers', 'cloud-rain', 'cloud-rain'],
    81: ['Rain showers', 'cloud-rain', 'cloud-rain'],
    82: ['Heavy rain showers', 'cloud-rain', 'cloud-rain'],
    85: ['Snow showers', 'cloud-snow', 'cloud-snow'],
    86: ['Heavy snow showers', 'cloud-snow', 'cloud-snow'],
    95: ['Thunderstorm', 'cloud-lightning', 'cloud-lightning'],
    96: ['Thunderstorm with hail', 'cloud-lightning', 'cloud-lightning'],
    99: ['Severe thunderstorm', 'cloud-lightning', 'cloud-lightning']
  };
  // Unknown code -> neutral cloud, never a misleading "sunny"
  const lookup = (code, night) => {
    const w = WMO[code] || ['Conditions unavailable', 'cloud', 'cloud'];
    return { desc: w[0], icon: night ? w[2] : w[1] };
  };

  // ---- Render -------------------------------------------------------------
  function render(data, fetchedAt) {
    const c = data.current, d = data.daily;
    const cond = lookup(c.weather_code, c.is_day === 0);

    el.temp.textContent = deg(c.temperature_2m);
    el.desc.textContent = cond.desc;
    setIcon(el.icon, cond.icon);
    el.hi.textContent = deg(d.temperature_2m_max[0]);
    el.lo.textContent = deg(d.temperature_2m_min[0]);
    el.wind.textContent = (num(c.wind_speed_10m) === null ? '--' : num(c.wind_speed_10m)) + ' km/h';
    el.hum.textContent = pct(c.relative_humidity_2m);
    el.feels.textContent = deg(c.apparent_temperature);
    el.rain.textContent = pct(d.precipitation_probability_max[0]);

    // Forecast: tomorrow + next 4 days
    let html = '';
    for (let i = 1; i <= 5 && i < d.time.length; i++) {
      const [y, m, day] = d.time[i].split('-').map(Number);
      // Built as UTC so the weekday can never shift with the device's timezone
      const name = dayFmt.format(new Date(Date.UTC(y, m - 1, day))).toUpperCase();
      const icon = lookup(d.weather_code[i], false).icon;
      html += '<div class="day">' +
        '<span class="dn">' + name + '</span>' +
        '<svg class="ic" viewBox="0 0 24 24"><use href="#i-' + icon + '"/></svg>' +
        '<span class="hi">' + deg(d.temperature_2m_max[i]) + '</span>' +
        '<span class="lo">' + deg(d.temperature_2m_min[i]) + '</span>' +
        '<span class="rain">' + pct(d.precipitation_probability_max[i]) + '</span>' +
        '</div>';
    }
    el.fc.innerHTML = html;

    const stale = Date.now() - fetchedAt > STALE_AFTER_MS;
    el.updated.textContent = (stale ? 'Last known weather, updated ' : 'Updated ') + timeFmt.format(new Date(fetchedAt));
  }

  // ---- Data: cache first for instant paint, then network ------------------
  function readCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (c && c.data && Date.now() - c.t < MAX_CACHE_AGE_MS) return c;
    } catch (e) {}
    return null;
  }
  function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
  }

  let timer = null, failures = 0;
  const schedule = ms => { clearTimeout(timer); timer = setTimeout(refresh, ms); };

  async function refresh() {
    let abort;
    try {
      // Timeout via Promise.race (an AbortSignal can't cross postMessage in sandboxed previews)
      const timeout = new Promise((_, reject) => {
        abort = setTimeout(() => reject(new Error('Timeout')), FETCH_TIMEOUT_MS);
      });
      const res = await Promise.race([fetch(API_URL, { cache: 'no-store' }), timeout]);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.current || !data.daily) throw new Error('Bad payload');
      writeCache(data);
      render(data, Date.now());
      failures = 0;
      schedule(REFRESH_MS);
    } catch (err) {
      console.error('Weather fetch failed:', err);
      // Keep whatever is on screen if it is still fresh; otherwise say so honestly
      const cached = readCache();
      if (cached) render(cached.data, cached.t);
      else { el.desc.textContent = 'Weather unavailable'; el.updated.textContent = ''; }
      failures++;
      schedule(Math.min(RETRY_MS * 2 ** (failures - 1), 5 * 60 * 1000));
    } finally {
      clearTimeout(abort);
    }
  }

  const cached = readCache();
  if (cached) render(cached.data, cached.t);
  refresh();

  // Offline cache for the page + images (needs sw.js beside this file and http/https hosting)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // If the player wakes from sleep or the network returns, update right away
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('online', refresh);
})();
</script>
</body>
</html>
